<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Red Wolves SVG Animation</title>
        <style>
            :root {
                  --hair-light: #87223f;
                  --hair-dark: #5a1315;
                  --eye-dark: #f2ab3c;
                  --eye-light: #ffd655;
                  --line-color: #000;
                  --stroke-color: #fff;
                  --background-color: black;
                }

        body, html {
          margin: 0;
          padding: 0;
          background-color: var(--background-color);
        }
        
        #obj1 {
          height: 100vh;
          width: 100vw;
          display: block;
          margin-left: auto;
          margin-right: auto;
        }
        </style>
    </head>
    <body>
        <object 
            id="obj1" 
            type="image/svg+xml" 
            data="red-wolves/red_wolves_2.svg">
        </object>
    </body>
</html>
